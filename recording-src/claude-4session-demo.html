<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Claude Code ×4 세션 워크플로 데모</title>
<style>
  :root {
    --bg: #0c0c0c;
    --tabbar: #17181c;
    --gap: #26282e;
    --rule: #3a3d45;
    --text: #cfd2d9;
    --dim: #9aa0ab;
    --faint: #676d78;
    --code: #6cb6ff;
    --orange: #ff7f6e;
    --focus: #3f8cff;
    --green: #53d17a;
    --mono: "Cascadia Code", "Cascadia Mono", Consolas, "D2Coding", monospace;
    --sans: "Segoe UI", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---- Windows Terminal 탭바 ---- */
  .tabs {
    flex: none;
    height: 36px;
    background: var(--tabbar);
    display: flex;
    align-items: flex-end;
    padding: 0 8px;
    gap: 4px;
    font-family: var(--sans);
    font-size: 12px;
    color: var(--dim);
    user-select: none;
  }

  .tab {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--bg);
    color: var(--text);
    border-radius: 7px 7px 0 0;
    padding: 7px 12px;
    max-width: 260px;
  }

  .tab .tico {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    background: #0f3a8f;
    color: #fff;
    font: 700 8px/14px var(--mono);
    text-align: center;
    flex: none;
  }
  .tab .tico::before { content: ">_"; }

  .tab .tt { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .tab .x { color: var(--faint); margin-left: 4px; }
  .tabs .plus, .tabs .chevd { padding: 7px 8px; color: var(--faint); }
  .tabs .wc { margin-left: auto; display: flex; color: var(--faint); align-self: center; }
  .tabs .wc span { padding: 4px 14px; font-size: 11px; }

  /* ---- 2×2 페인 ---- */
  .grid {
    flex: 1;
    min-height: 0;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 1px;
    background: var(--gap);
  }

  .pane {
    background: var(--bg);
    display: flex;
    flex-direction: column;
    min-height: 0;
    position: relative;
  }

  .pane.focus { outline: 1px solid var(--focus); outline-offset: -1px; z-index: 1; }

  .scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 12px 16px 8px;
  }

  .scroll::-webkit-scrollbar { width: 9px; }
  .scroll::-webkit-scrollbar-thumb { background: #23252b; border-radius: 5px; }

  .lines { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; line-height: 1.62; }

  .ln { white-space: pre-wrap; word-break: break-word; animation: in 0.15s ease-out; }
  @keyframes in { from { opacity: 0; } to { opacity: 1; } }

  .ln .c { color: var(--code); }
  .ln b { font-weight: 600; }

  .ln-u { color: var(--faint); margin-top: 10px; }
  .ln-u::before { content: "> "; }

  /* PowerShell 부트 시퀀스 */
  .ln-ps { color: var(--dim); }
  .ln-ps .cmd { color: #e5c07b; }
  .ln-ps .psp { color: var(--text); }

  /* Claude Code 웰컴 박스 */
  .ln-box {
    border: 1px solid var(--rule);
    border-radius: 6px;
    padding: 8px 14px;
    color: var(--dim);
    display: inline-block;
    margin-top: 8px;
  }
  .ln-box .st { color: #d97757; }
  .ln-box b { color: var(--text); }

  .ln-txt { color: var(--text); margin-top: 6px; }
  .ln-tool { color: var(--text); margin-top: 6px; }
  .ln-tool::before { content: "⏺ "; color: var(--green); }
  .ln-sub { color: var(--faint); }
  .ln-sub::before { content: "  ⎿  "; }

  .ln-foot { color: var(--text); margin-top: 6px; }
  .ln-done { color: var(--faint); margin-top: 6px; }
  .ln-recap { color: var(--faint); font-style: italic; margin-top: 6px; }
  .ln-meta { color: var(--faint); text-align: right; }

  /* ---- 하단 입력부 ---- */
  .inbox { flex: none; padding: 0 16px 8px; font-size: 12.5px; }
  .inbox .rule { border-top: 1px solid var(--rule); }

  .inbox .in {
    display: flex;
    align-items: baseline;
    padding: 7px 0;
    min-height: 32px;
    color: var(--text);
  }

  .inbox .chev { color: var(--text); font-weight: 700; margin-right: 8px; }
  .inbox .typed { white-space: pre-wrap; word-break: break-word; }
  .inbox .cur { color: var(--text); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .perm { padding-top: 6px; font-size: 12px; color: var(--faint); }
  .perm .pp { color: var(--orange); }

  /* ---- 플로팅 컨트롤 ---- */
  .ctrl {
    position: fixed;
    left: 50%;
    bottom: 14px;
    translate: -50% 0;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(23, 24, 28, 0.92);
    border: 1px solid var(--gap);
    border-radius: 99px;
    padding: 8px 14px;
    font-family: var(--sans);
    z-index: 10;
    transition: opacity 0.4s;
    box-shadow: 0 8px 30px rgba(0, 0, 0, 0.55);
  }

  .ctrl.faded { opacity: 0.1; }
  .ctrl:hover, .ctrl:focus-within { opacity: 1; }

  .btn {
    background: none;
    border: 1px solid var(--gap);
    color: var(--text);
    border-radius: 99px;
    font: 600 12px var(--sans);
    padding: 5px 13px;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn:hover { border-color: var(--faint); }
  .btn:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .btn--play { background: var(--focus); border-color: var(--focus); color: #fff; min-width: 84px; }

  .progress { width: 130px; height: 4px; background: var(--gap); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 0%; background: var(--focus); }

  .clock { font: 500 11px var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; }

  @media (max-width: 860px) {
    body { overflow: auto; }
    .grid { grid-template-columns: 1fr; grid-template-rows: repeat(4, minmax(260px, 1fr)); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ln, .inbox .cur { animation: none; }
  }
</style></head>

<div class="tabs">

<div class="grid" id="grid" role="img" aria-label="Claude Code 4개 세션이 퍼블리싱 업무를 병렬로 처리하는 터미널 데모"></div>

<div class="ctrl" id="ctrl">

    { t: 35.5, p: 0, k: "sub",  x: "v1.4.2 섹션 — Changed 2건 추가" },
    { t: 36.6, p: 0, k: "done", x: "✻ Logged for 12s" }
  ];

  /* 중요도 순 재배치 — 시선이 먼저 가는 좌상단(0)부터 토큰화·다크모드 →
     접근성 → 반응형 → 디버깅·성능. 끝까지 보지 않는 시청자를 위해
     타이핑 시작 순서도 같아지도록 스트림별 오프셋으로 원래 스태거
     (1.0 / 2.2 / 4.6 / 6.8)를 새 위치에 맞춰 재사용한다. */
  var ORDER  = { 1: 0, 2: 1, 0: 2, 3: 3 }; /* 원본 p → 새 페인 */
  var OFFSET = { 1: -1.2, 2: -2.4, 0: 3.6, 3: 0 };

  var SHIFT = 2.0; /* 부트 시퀀스 이후 본편 시작 */
  var EV = BOOT.concat(MAIN.map(function (e) {
    return { t: e.t + SHIFT + OFFSET[e.p], p: ORDER[e.p], k: e.k, x: e.x };
  })).sort(function (a, b) { return a.t - b.t; });

  var grid = document.getElementById("grid");
  var panes = [];
  for (var i = 0; i < PANES; i++) {
    var sec = document.createElement("section");
    sec.className = "pane";
    sec.innerHTML =
      "<div class='scroll'><div class='lines'></div></div>" +
      "<div class='inbox'>" +
        "<div class='rule'></div>" +
        "<div class='in'><span class='chev'>❯</span><span class='typed'></span><span class='cur'>▍</span></div>" +
        "<div class='rule'></div>" +
        "<div class='perm'><span class='pp'>▶▶ bypass permissions on</span> <span>(shift+tab to cycle) · ← for agents</span></div>" +
      "</div>";
    grid.appendChild(sec);
    panes.push({
      el: sec,
      lines: sec.querySelector(".lines"),
      scroll: sec.querySelector(".scroll"),
      typed: sec.querySelector(".typed")
    });
  }

  var playBtn = document.getElementById("play");
  var speedBtn = document.getElementById("speed");
  var ctrl = document.getElementById("ctrl");
  var progEl = document.getElementById("prog");
  var clockEl = document.getElementById("clock");

  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var SPEEDS = [1, 1.5, 2];
  var spdIdx = 0;
  var playing = false;
  var time = 0;
  var next = 0;
  var typers = [];
  var last = null;

  function fmt(s) {
    s = Math.max(0, Math.min(TOTAL, s));
    return ("0" + Math.floor(s / 60)).slice(-2) + ":" + ("0" + Math.floor(s % 60)).slice(-2);
  }

  function setFocus(p) {
    panes.forEach(function (pn, i) { pn.el.classList.toggle("focus", i === p); });
  }

  function addLine(p, cls, html, asText) {
    var el = document.createElement("div");
    el.className = "ln " + cls;
    if (asText) el.textContent = html;
    else el.innerHTML = html;
    panes[p].lines.appendChild(el);
    panes[p].scroll.scrollTop = panes[p].scroll.scrollHeight;
    return el;
  }

  function fire(ev) {
    if (ev.k === "type") {
      setFocus(ev.p);
      if (reduced) {
        addLine(ev.p, "ln-u", ev.x, true);
      } else {
        typers.push({ p: ev.p, text: ev.x, start: time });
      }
      return;
    }
    var map = { tool: "ln-tool", sub: "ln-sub", txt: "ln-txt", foot: "ln-foot", done: "ln-done", recap: "ln-recap", meta: "ln-meta", ps: "ln-ps", box: "ln-box" };
    var asText = ev.k === "foot" || ev.k === "done" || ev.k === "recap" || ev.k === "meta";
    addLine(ev.p, map[ev.k] || "ln-txt", ev.x, asText);
  }

  function tickTypers() {
    for (var i = typers.length - 1; i >= 0; i--) {
      var t = typers[i];
      var n = Math.floor((time - t.start) * CPS);
      if (n >= t.text.length) {
        panes[t.p].typed.textContent = "";
        addLine(t.p, "ln-u", t.text, true);
        typers.splice(i, 1);
      } else {
        panes[t.p].typed.textContent = t.text.slice(0, n);
      }
    }
  }

  function frame(now) {
    if (playing) {
      var dt = last === null ? 0 : (now - last) / 1000;
      last = now;
      time += dt * SPEEDS[spdIdx];

      while (next < EV.length && EV[next].t <= time) fire(EV[next++]);
      tickTypers();

      progEl.style.width = (time / TOTAL) * 100 + "%";
      clockEl.textContent = fmt(time);

      if (time >= TOTAL) {
        playing = false;
        playBtn.textContent = "▶ 다시";
        ctrl.classList.remove("faded");
        setFocus(-1);
      }
    } else {
      last = now;
    }
    requestAnimationFrame(frame);
  }

  function reset() {
    time = 0;
    next = 0;
    typers = [];
    panes.forEach(function (p) { p.lines.innerHTML = ""; p.typed.textContent = ""; });
    setFocus(-1);
    progEl.style.width = "0%";
    clockEl.textContent = fmt(0);
  }

  playBtn.addEventListener("click", function () {
    if (time >= TOTAL) reset();
    playing = !playing;
    playBtn.textContent = playing ? "⏸" : "▶ 재생";
    ctrl.classList.toggle("faded", playing);
  });

  document.getElementById("restart").addEventListener("click", function () {
    reset();
    playing = true;
    playBtn.textContent = "⏸";
    ctrl.classList.add("faded");
  });

  speedBtn.addEventListener("click", function () {
    spdIdx = (spdIdx + 1) % SPEEDS.length;
    speedBtn.textContent = SPEEDS[spdIdx] + "×";
  });

  clockEl.textContent = fmt(0);
  requestAnimationFrame(frame);
})();
</script>
</body></html>
